<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-hidden="true">
  <defs>
    <style>
      .curve{fill:none;stroke:#dbe6f3;stroke-opacity:.58;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .axis{stroke:#dbe6f3;stroke-opacity:.26;stroke-width:2}
      .tick{stroke:#dbe6f3;stroke-opacity:.18;stroke-width:2}
      .label{font: italic 18px Georgia, 'Times New Roman', serif; fill:#dbe6f3; fill-opacity:.30}
      .formula{font: italic 24px Georgia, 'Times New Roman', serif; fill:#dbe6f3; fill-opacity:.33}
      .small{font-size:21px; fill-opacity:.28}
      .tiny{font-size:20px; fill-opacity:.28}
      .sub{font-size:70%; baseline-shift:sub;}
      .sup{font-size:70%; baseline-shift:super;}
    </style>
  </defs>

  <!-- MGF, upper left -->
  <text class="formula small" x="92" y="108">M<tspan class="sub">X</tspan>(t) = E[e<tspan class="sup">tX</tspan>]</text>

  <!-- normal curve -->
  <line class="axis" x1="170" y1="192" x2="598" y2="192"/>
  <line class="axis" x1="384" y1="70" x2="384" y2="210" stroke-dasharray="7 9"/>
  <line class="tick" x1="226" y1="192" x2="226" y2="201"/>
  <line class="tick" x1="384" y1="192" x2="384" y2="201"/>
  <line class="tick" x1="542" y1="192" x2="542" y2="201"/>
  <text class="label" x="191" y="232">μ − 2σ</text>
  <text class="label" x="377" y="232">μ</text>
  <text class="label" x="506" y="232">μ + 2σ</text>
  <path class="curve" d="M170 192 C214 192, 246 188, 274 170 C304 151, 331 108, 352 84 C361 74, 370 68, 384 64 C398 68, 407 74, 416 84 C437 108, 464 151, 494 170 C522 188, 554 192, 598 192"/>

  <!-- normal pdf, lower right -->
  <text class="formula small" x="300" y="314">f(x) = 1 / (σ √(2π)) e<tspan class="sup">−(x−μ)²/(2σ²)</tspan></text>

  <!-- MLE, lower left -->
  <text class="formula tiny" x="120" y="362">θ̂ = arg max<tspan class="sub">θ</tspan> L(θ)</text>
</svg>